<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Doggy Viewer</title>
    <!-- desktop screen size css -->
    <link rel="stylesheet" media="screen" href="static/css/desktop.css" type="text/css" />
    <!-- mobile screen size css -->
    <link rel="stylesheet" media="handheld" href="static/css/mobile.css" type="text/css" />
</head>

<body>
    <div class="header">
        <h1 class="head-title">Doggy Viewer</h1>
        <p class="head-subtitle">Your favorite dog image viewer</p>
    </div>
    <div id="options">
        <!-- User should be able to select one OR MORE dog breeds
        -->
        <input type="text" id="breed-search" placeholder="Search for a breed">
        <div id="breed-checkboxes"></div>
    </div>
    <div id="viewer">
        <!-- Images get added here -->
    </div>
    <script src="static/js/app.js"></script>
</body>

</html>
